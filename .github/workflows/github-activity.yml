name: Update Profile GitHub Activity

on:
  schedule:
    # Triggers at the start of every hour automatically
    - cron: '0 * * * *'
  workflow_dispatch: # Keeps manual button execution enabled for immediate testing

permissions:
  contents: write

jobs:
  update-activity:
    name: Fetch Recent Code Activity
    runs-on: ubuntu-latest
    steps:
      # Upgraded checkout version to native Node 24 support to remove runner errors
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject GitHub Activity Into README
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "Specify auto-update profile telemetry timeline"
          MAX_LINES: 5
