name: Update Profile GitHub Activity
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-activity:
    name: Fetch Recent Code Activity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Inject GitHub Activity Into README
        uses: jamesgeorge007/github-activity-readme@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          TARGET_FILE: "README.md"
          COMMIT_MSG: "Update profile activity timeline"
          MAX_LINES: 5
          FILTER_EVENTS: "PushEvent,PullRequestEvent,IssuesEvent,ReleaseEvent"
