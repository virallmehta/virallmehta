name: Update Profile GitHub Activity

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    name: Fetch Recent Code Activity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject GitHub Activity Into README
        uses: gautamkrishnar/github-activity-readme@v1.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicit environment override flag to completely bypass Node runtime version blocks
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          COMMIT_MSG: "Specify auto-update profile telemetry timeline"
          MAX_LINES: 5
