name: Update Profile GitHub Activity

on:
  schedule:
    # Triggers at the start of every hour automatically
    - cron: '0 * * * *'
  workflow_dispatch: # Keeps manual button testing enabled

permissions:
  contents: write # Crucial: grants permissions to write the updates to your README

jobs:
  update-activity:
    name: Fetch Recent Code Activity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject GitHub Activity Into README
        uses: subbiah-developer/github-activity-readme@v0.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          COMMIT_MSG: "Specify auto-update profile telemetry timeline"
          MAX_LINES: 5
