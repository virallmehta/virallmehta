name: Update Profile GitHub Activity

on:
  schedule:
    # Automatically triggers at the start of every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Keeps manual button testing enabled

permissions:
  contents: write

jobs:
  update-activity:
    name: Fetch Recent Code Activity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject GitHub Activity Into README
        uses: gautamkrishnar/user-activity-workflow@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # This action reads your exact tags automatically
          # Limits output to your 5 most recent actions
          limit: 5
