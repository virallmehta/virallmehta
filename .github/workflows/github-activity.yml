name: Update Profile GitHub Activity

on:
  schedule:
    # Automatically triggers at the start of every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Keeps the manual play button active

permissions:
  contents: write # Mandatory to commit logs back into your profile file

jobs:
  update-activity:
    name: Fetch Recent Code Activity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject GitHub Activity Into README
        uses: subbiah-developer/github-activity-readme@v0.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Crucial argument: Forces the parser directly to your file
          FILENAME: "README.md"
          COMMIT_MSG: "Specify auto-update profile telemetry timeline"
          MAX_LINES: 5
